<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessórios - Catálogo Nespresso</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="theme-dark.css?v=8">
    <link rel="stylesheet" href="produtos-pro.css?v=18">
    <link rel="stylesheet" href="acessorios-pro.css?v=3">
</head>
<body class="app-page accessories-page">

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header pro-catalog-hero"><div class="accessories-hero-copy"><h1>ACESSÓRIOS DE CAFÉ LINHA PROFISSIONAL</h1><p>Da xícara ao porta-cápsulas, encontre os acessórios para completar a experiência de café da sua empresa.</p></div></header>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar acessórios, SKU ou coleção..." oninput="filtrarAcessorios()" aria-label="Pesquisar acessórios por nome, SKU, embalagem ou categoria">
            <button class="btn btn-primary" onclick="abrirModal()">+ Novo Acessório</button>
        </div>

        <nav id="categoriasNav" class="pro-category-nav" aria-label="Categorias de acessórios"></nav>
        <div class="pro-catalog-heading"><h2>Complete sua experiência de café</h2><span id="acessoriosContagem" role="status"></span></div>
        <div id="acessoriosTableBody" class="pro-catalog" aria-label="Catálogo de acessórios"><p class="pro-status">Carregando acessórios...</p></div>
    </div>

    <!-- MODAL DE VISUALIZAR / DETALHES + SIMULADOR DE PEDIDO -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes e Simulador de Quantidade</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Conteúdo preenchido via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="acessorioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Novo Acessório</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="acessorioForm" onsubmit="salvarAcessorio(event)">
                <input type="hidden" id="acessorioId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>SKU:</label>
                        <input type="text" id="skuInput" required placeholder="Ex: 3541 ou 3519/BULK">
                    </div>
                    <div class="form-group">
                        <label>Descrição do Item:</label>
                        <input type="text" id="nomeInput" required placeholder="Ex: Pires LUME Cappuccino 12 Unidades">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Embalagem (Venda):</label>
                        <select id="tipoEmbalagemInput" style="background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; color: var(--ink); font-size: 14px; width: 100%;">
                            <option value="Unidade">Unidade (1 peça avulsa)</option>
                            <option value="Caixa / Kit">Caixa / Kit (Conjunto fechado)</option>
                            <option value="Caixa Bulk">Caixa Bulk (Atacado)</option>
                            <option value="Pacote">Pacote (Descartáveis / Insumos)</option>
                            <option value="Promocional">Promocional / Bonificação</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unidades dentro da Embalagem:</label>
                        <input type="number" id="qtdEmbalagemInput" required min="1" value="1" oninput="calcularPrecoUnid()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Preço da Embalagem (R$):</label>
                        <input type="text" id="precoEmbalagemInput" required placeholder="Ex: 78,65" oninput="calcularPrecoUnid()">
                    </div>
                    <div class="form-group">
                        <label>Custo por Peça / Unidade (R$):</label>
                        <input type="text" id="precoUnidInput" readonly style="background: var(--surface); color: var(--success); font-weight: bold;" placeholder="Calculado automaticamente">
                    </div>
                </div>

                <div class="form-group">
                    <label>Foto (Link de imagem PNG/JPG):</label>
                    <input type="text" id="fotoInput" placeholder="https://exemplo.com/foto.png">
                </div>

                <div class="form-group">
                    <label>Observações:</label>
                    <textarea id="observacoesInput" rows="3" placeholder="Detalhes da embalagem, voltagem, regras de bonificação..." style="background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; color: var(--ink); font-size: 14px; width: 100%; resize: vertical;"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="acessorios.js?v=11"></script>
    <script src="ui.js?v=6"></script>
</body>
</html>
