<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessórios - Sistema Nespresso</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>🥄 Catálogo de Acessórios</h1>
                <p>Xícaras, Açúcares, Mexedores e Complementos Nespresso</p>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-secondary">👥 Clientes</a>
                <a href="produtos_b2b.html" class="btn btn-secondary">☕ Cápsulas B2B</a>
                <a href="produtos_b2c.html" class="btn btn-secondary">🏠 Cápsulas B2C</a>
                <a href="acessorios.html" class="btn btn-primary">🥄 Acessórios</a>
                <a href="pedidos.html" class="btn btn-secondary">📦 Pedidos</a>
            </div>
        </header>

        <!-- BARRA DE BUSCA E BOTÃO NOVO -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por SKU ou Nome do Acessório..." oninput="filtrarAcessorios()">
            </div>
            <button class="btn btn-primary" onclick="abrirModalAcessorio()">+ Novo Acessório</button>
        </div>

        <!-- TABELA DE ACESSÓRIOS -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Nome do Acessório</th>
                        <th>Tipo de Embalagem</th>
                        <th>Qtd. na Embalagem</th>
                        <th>Preço Embalagem (R$)</th>
                        <th>Preço Unit. (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAcessoriosBody">
                    <tr>
                        <td colspan="7" style="text-align: center;">Carregando acessórios...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE ACESSÓRIO -->
    <div id="modalAcessorio" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Novo Acessório</h2>
                <span class="close" onclick="fecharModalAcessorio()">&times;</span>
            </div>
            <form id="formAcessorio" onsubmit="salvarAcessorio(event)">
                <input type="hidden" id="acessorioId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>SKU (Código):</label>
                        <input type="text" id="skuInput" required>
                    </div>
                    <div class="form-group">
                        <label>Nome do Acessório:</label>
                        <input type="text" id="nomeInput" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Embalagem:</label>
                        <input type="text" id="tipoEmbalagemInput" placeholder="Ex: Caixa / Kit, Caixa Bulk, Pacote, Unidade" required>
                    </div>
                    <div class="form-group">
                        <label>Quantidade na Embalagem:</label>
                        <input type="number" id="qtdEmbalagemInput" min="1" value="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Preço da Embalagem (R$):</label>
                        <input type="text" id="precoEmbalagemInput" placeholder="Ex: 78,65">
                    </div>
                    <div class="form-group">
                        <label>Preço Unitário (R$):</label>
                        <input type="text" id="precoUnidInput" placeholder="Ex: 6,55">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalAcessorio()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Acessório</button>
                </div>
            </form>
        </div>
    </div>

    <script src="acessorios.js"></script>
</body>
</html>
