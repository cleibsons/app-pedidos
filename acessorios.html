<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessórios - Catálogo Nespresso</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-page">

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>Acessórios</h1>
                <p>Controle de caixas, kits, pacotes e cálculo unitário automático</p>
            </div>
            
        </header>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar por Descrição, SKU ou Tipo de Embalagem..." onkeyup="filtrarAcessorios()">
            <button class="btn btn-primary" onclick="abrirModal()">+ Novo Acessório</button>
        </div>

        <!-- TABELA DE ACESSÓRIOS -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px; text-align: center;">Foto</th>
                        <th>SKU</th>
                        <th>Descrição do Acessório</th>
                        <th>Apresentação (Qtd)</th>
                        <th>Preço (Embalagem)</th>
                        <th>Custo Unitário (Peça)</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="acessoriosTableBody">
                    <tr><td colspan="7" style="text-align:center; color: #78717a; padding: 24px;">Carregando acessórios da nuvem...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAR / DETALHES + SIMULADOR DE PEDIDO -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes e Simulador de Quantidade</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Conteúdo preenchido via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="acessorioModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Novo Acessório</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="acessorioForm" onsubmit="salvarAcessorio(event)">
                <input type="hidden" id="acessorioId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>SKU:</label>
                        <input type="text" id="skuInput" required placeholder="Ex: 3541 ou 3519/BULK">
                    </div>
                    <div class="form-group">
                        <label>Descrição do Item:</label>
                        <input type="text" id="nomeInput" required placeholder="Ex: Pires LUME Cappuccino 12 Unidades">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Embalagem (Venda):</label>
                        <select id="tipoEmbalagemInput" style="background: #f7f5f2; border: 1px solid #e6e1dc; border-radius: 6px; padding: 10px; color: #242326; font-size: 14px; width: 100%;">
                            <option value="Unidade">Unidade (1 peça avulsa)</option>
                            <option value="Caixa / Kit">Caixa / Kit (Conjunto fechado)</option>
                            <option value="Caixa Bulk">Caixa Bulk (Atacado)</option>
                            <option value="Pacote">Pacote (Descartáveis / Insumos)</option>
                            <option value="Promocional">Promocional / Bonificação</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Unidades dentro da Embalagem:</label>
                        <input type="number" id="qtdEmbalagemInput" required min="1" value="1" oninput="calcularPrecoUnid()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Preço da Embalagem (R$):</label>
                        <input type="text" id="precoEmbalagemInput" required placeholder="Ex: 78,65" oninput="calcularPrecoUnid()">
                    </div>
                    <div class="form-group">
                        <label>Custo por Peça / Unidade (R$):</label>
                        <input type="text" id="precoUnidInput" readonly style="background: #ffffff; color: #23745d; font-weight: bold;" placeholder="Calculado automaticamente">
                    </div>
                </div>

                <div class="form-group">
                    <label>Foto (Link de imagem PNG/JPG):</label>
                    <input type="text" id="fotoInput" placeholder="https://exemplo.com/foto.png">
                </div>

                <div class="form-group">
                    <label>Observações:</label>
                    <textarea id="observacoesInput" rows="3" placeholder="Detalhes da embalagem, voltagem, regras de bonificação..." style="background: #f7f5f2; border: 1px solid #e6e1dc; border-radius: 6px; padding: 10px; color: #242326; font-size: 14px; width: 100%; resize: vertical;"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="acessorios.js?v=2"></script>
    <script src="ui.js?v=2"></script>
</body>
</html>
