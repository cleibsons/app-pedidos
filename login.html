<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Nespresso</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f172a;
            margin: 0;
            font-family: sans-serif;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .login-card h2 {
            color: #f8fafc;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-entrar {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-entrar:hover {
            background: #1d4ed8;
        }
        #erroMsg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 Central Nespresso</h2>
        <form onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="emailInput" autocomplete="username" required placeholder="Seu e-mail de acesso">
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="senhaInput" autocomplete="current-password" required placeholder="Sua senha">
            </div>
            <button type="submit" class="btn-entrar">Entrar no Sistema</button>
            <p id="erroMsg" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://awllwrltulzmjdcchlxs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__Cj-tdVffbiigN0-YczRkw_eVLEUIMZ';
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (error) {
            document.getElementById('erroMsg').textContent =
                'Não foi possível iniciar a conexão. Recarregue a página e verifique sua internet.';
        }

        function mensagemErroLogin(error) {
            if (error.code === 'invalid_credentials') return 'E-mail ou senha incorretos.';
            if (error.code === 'email_not_confirmed') return 'Confirme seu e-mail antes de entrar.';
            if (error.status === 429) return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
            if (error.code === 'email_provider_disabled') return 'O acesso por e-mail está desativado no Supabase.';
            if (error.status === 401 || error.status === 403) return 'Acesso recusado pelo Supabase. Verifique a configuração do projeto e da chave pública.';
            return 'Não foi possível entrar. Verifique sua conexão e tente novamente.';
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const botao = document.querySelector('.btn-entrar');
            if (botao.disabled) return;
            const erroMsg = document.getElementById('erroMsg');
            const email = document.getElementById('emailInput').value.trim();
            const senha = document.getElementById('senhaInput').value;
            botao.disabled = true;
            erroMsg.textContent = 'Autenticando...';

            try {
                if (!supabaseClient) {
                    erroMsg.textContent = 'Não foi possível iniciar a conexão. Recarregue a página e verifique sua internet.';
                    return;
                }
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password: senha
                });
                if (error) {
                    erroMsg.textContent = mensagemErroLogin(error);
                    return;
                }
                if (!data?.session) {
                    erroMsg.textContent = 'O Supabase não retornou uma sessão. Tente entrar novamente.';
                    return;
                }
                window.location.replace('pedidos.html');
            } catch (error) {
                erroMsg.textContent = 'Não foi possível conectar ao Supabase. Verifique sua internet e tente novamente.';
            } finally {
                botao.disabled = false;
            }
        }
    </script>
</body>
</html>
