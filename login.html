<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Nespresso</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="theme-dark.css?v=8"><link rel="stylesheet" href="conta.css?v=1">
</head>
<body class="login-page">

    <div class="login-card">
        <a class="login-brand" href="index.html" aria-label="Central Nespresso — início"><span class="brand-lockup"><img class="brand-logo" src="https://upload.wikimedia.org/wikipedia/commons/4/48/Nespresso.png" alt="Nespresso" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="brand-fallback" hidden>NESPRESSO</span><small>CENTRAL DE PEDIDOS</small></span></a><p class="eyebrow">SEU ESPAÇO DE GESTÃO</p><h1 id="loginHeading">Bem-vindo de volta.</h1><p class="login-intro" id="loginIntro">Entre para acessar seus clientes, catálogos e pedidos.</p>
        <form id="loginForm" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label for="emailInput">E-mail</label>
                <input type="email" id="emailInput" autocomplete="username" required placeholder="Seu e-mail de acesso">
            </div>
            <div class="form-group">
                <label for="senhaInput">Senha</label>
                <div class="password-field"><input type="password" id="senhaInput" autocomplete="current-password" required placeholder="Sua senha"><button type="button" class="password-toggle" data-password="senhaInput" aria-controls="senhaInput" aria-pressed="false">Mostrar</button></div>
            </div>
            <button type="submit" class="btn-entrar">Entrar na central →</button>
            <button type="button" id="forgotPassword" class="text-button login-recovery-link">Esqueci minha senha</button><p id="erroMsg" role="status" aria-live="polite"></p>
        </form><form id="recoveryForm" class="reset-form" hidden><div class="form-group"><label for="recoveryEmail">E-mail de acesso</label><input type="email" id="recoveryEmail" autocomplete="email" required placeholder="Seu e-mail cadastrado"></div><button class="btn-entrar" type="submit">Enviar link de recuperação</button><button class="text-button login-recovery-link" type="button" id="backToLogin">Voltar para entrar</button><p id="recoveryMessage" class="account-message" role="status" aria-live="polite"></p></form><p class="login-footnote">Seus negócios, organizados em um só lugar.</p>
    </div>

    <script src="auth-client.js?v=1"></script><script src="login.js?v=1"></script>
</body>
</html>
