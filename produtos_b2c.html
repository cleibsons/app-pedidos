<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsulas B2C - Nespresso (Vertuo & Original)</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="theme-dark.css?v=8">
    <link rel="stylesheet" href="produtos-pro.css?v=18">
    <link rel="stylesheet" href="produtos-b2c.css?v=1">
</head>
<body class="app-page b2c-page" data-system="Todos">

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header pro-catalog-hero b2c-hero" aria-labelledby="catalogTitle"><div class="b2c-hero-copy"><span class="b2c-eyebrow">Nespresso · Original &amp; Vertuo</span><h1 id="catalogTitle">SEU MOMENTO DE CAFÉ,<br>DO SEU JEITO</h1><p>Dos espressos clássicos aos cafés longos e cremosos, explore os sabores das linhas Original e Vertuo.</p></div></header>

        <!-- FILTROS DE LINHA -->
        <div class="filter-tabs" role="group" aria-label="Filtrar por sistema de cápsulas">
            <button class="filter-btn active" id="btnFiltroTodos" aria-pressed="true" onclick="filtrarSistema('Todos')">Todas as Cápsulas</button>
            <button class="filter-btn" id="btnFiltroVertuo" aria-pressed="false" onclick="filtrarSistema('Vertuo')">Linha Vertuo</button>
            <button class="filter-btn" id="btnFiltroOriginal" aria-pressed="false" onclick="filtrarSistema('Original')">Linha Original</button>
        </div>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar café, SKU, coleção ou notas de sabor..." oninput="filtrarProdutos()" aria-label="Pesquisar cafés por nome, SKU, categoria ou notas de sabor">
            <button class="btn btn-primary" onclick="abrirModal()">+ Nova Cápsula B2C</button>
        </div>

        <nav id="categoriasNav" class="b2c-category-nav" aria-label="Coleções por sistema"></nav><div class="pro-catalog-heading"><h2>Explore nossos cafés</h2><span id="produtosContagem" role="status"></span></div><div id="produtosTableBody" class="pro-catalog" aria-label="Catálogo de cápsulas Original e Vertuo"><p class="pro-status">Carregando cafés...</p></div>
    </div>

    <!-- MODAL DE VISUALIZAR / DETALHES -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes do Blend B2C</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Conteúdo preenchido via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="produtoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Nova Cápsula B2C</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="produtoForm" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Linha / Sistema:</label>
                        <select id="sistemaInput" required style="background: var(--field); border: 1px solid var(--line); color: #fff; padding: 8px; border-radius: 6px;">
                            <option value="Vertuo">🌀 Linha Vertuo</option>
                            <option value="Original">🔴 Linha Original</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>SKU:</label>
                        <input type="text" id="skuInput" required placeholder="Ex: 7011.80">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nome do Produto (Blend):</label>
                        <input type="text" id="nomeInput" required placeholder="Ex: Ristretto Intenso">
                    </div>
                    <div class="form-group">
                        <label>Intensidade:</label>
                        <input type="number" id="intensidadeInput" min="1" max="13" placeholder="Ex: 9">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cápsulas por caixa:</label>
                        <input type="number" id="caixaQtdInput" required min="1" step="1" value="10">
                    </div>
                    <div class="form-group">
                        <label>Preço por cápsula (R$):</label>
                        <input type="text" id="precoInput" required placeholder="Ex: 3,90">
                    </div>
                </div>

                <div class="form-group">
                    <label>Foto (Link de imagem PNG):</label>
                    <input type="text" id="fotoInput" placeholder="https://exemplo.com/foto.png">
                </div>

                <div class="form-group">
                    <label>Observação:</label>
                    <textarea id="observacoesInput" rows="4" placeholder="Tamanho da xícara (ex: 25 ml, 40 ml, 230 ml), perfil aromático..." style="background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; color: var(--ink); font-size: 14px; width: 100%; resize: vertical;"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="vertuo-images.js?v=8"></script>
    <script src="b2c-catalogo.js?v=1"></script>
    <script src="produtos_b2c.js?v=9"></script>
    <script src="ui.js?v=4"></script>
</body>
</html>
