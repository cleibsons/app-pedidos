<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsulas B2B - Nespresso Professional</title>
    <link rel="stylesheet" href="styles.css?v=4">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="theme-dark.css?v=8">
    <link rel="stylesheet" href="produtos-pro.css?v=18">
<style>.catalog-hero-copy{width:100%;min-width:0;max-width:1000px}.header.pro-catalog-hero p{color:#f2eee7;font-size:15px;line-height:1.65;margin:12px auto 0;max-width:620px;text-wrap:pretty}@media(max-width:760px){.header.pro-catalog-hero p{font-size:13px;max-width:330px;margin-top:10px}}</style>
</head>
<body class="app-page">

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header pro-catalog-hero" aria-labelledby="catalogTitle"><div class="catalog-hero-copy"><h1 id="catalogTitle">CÁPSULAS DE CAFÉ PROFISSIONAIS</h1><p>Explore cafés profissionais e encontre o blend ideal para cada negócio.</p></div></header>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar café pelo nome ou SKU..." oninput="filtrarProdutos()" aria-label="Pesquisar cápsulas por nome ou SKU">
            <button class="btn btn-primary" onclick="abrirModal()">+ Nova cápsula</button>
        </div>

        <nav id="categoriasNav" class="pro-category-nav" aria-label="Categorias de café"></nav>
        <div class="pro-catalog-heading"><h2>Explore nossos cafés</h2><span id="produtosContagem" role="status"></span></div>
        <div class="pro-catalog" id="produtosGrid" aria-label="Catálogo de cápsulas profissionais"><p class="pro-status">Carregando catálogo profissional...</p></div>
    </div>

    <!-- MODAL DE VISUALIZAR / DETALHES -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes do Blend B2B</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Conteúdo preenchido via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="produtoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Novo Produto B2B</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="produtoForm" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>SKU:</label>
                        <input type="text" id="skuInput" required placeholder="Ex: 7011.80">
                    </div>
                    <div class="form-group">
                        <label>Nome do Produto (Blend):</label>
                        <input type="text" id="nomeInput" required placeholder="Ex: Ristretto Intenso">
                    </div>
                </div>

                <div class="form-group">
                    <label for="categoriaInput">Categoria:</label>
                    <select id="categoriaInput"><option value="">Sem categoria</option><option value="Creations">Creations</option><option value="Ristretto">Ristretto</option><option value="Espresso &amp; Lungo">Espresso &amp; Lungo</option><option value="Origins">Origins</option><option value="Limited">Limited</option></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Intensidade:</label>
                        <input type="number" id="intensidadeInput" min="1" max="13" placeholder="Ex: 9">
                    </div>
                    <div class="form-group">
                        <label>Cápsulas por caixa:</label>
                        <input type="number" id="caixaQtdInput" required min="1" step="1" value="50" oninput="calcularPrecoCaixa()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Preço por cápsula (R$):</label>
                        <input type="text" id="precoInput" required placeholder="Ex: 3,25" oninput="calcularPrecoCaixa()">
                    </div>
                    <div class="form-group">
                        <label>Valor da caixa (R$):</label>
                        <input type="text" id="precoCaixaCalculado" readonly style="background: var(--surface); color: var(--success);" placeholder="Calculado automaticamente">
                    </div>
                </div>

                <div class="form-group">
                    <label>Foto (Link de imagem PNG):</label>
                    <input type="text" id="fotoInput" placeholder="https://exemplo.com/foto.png">
                </div>

                <div class="form-group">
                    <label>Observação:</label>
                    <textarea id="observacoesInput" rows="4" placeholder="Perfil aromático, notas de cata..." style="background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; color: var(--ink); font-size: 14px; width: 100%; resize: vertical;"></textarea>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="produtos_b2b.js?v=18"></script>
    <script src="ui.js?v=4"></script>
</body>
</html>
