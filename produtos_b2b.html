<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsulas B2B - Sistema Nespresso</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>☕ Catálogo de Cápsulas B2B</h1>
                <p>Linha Nespresso Professional (Caixas com 50 cápsulas)</p>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-secondary">👥 Clientes</a>
                <a href="produtos_b2b.html" class="btn btn-primary">☕ Cápsulas B2B</a>
                <a href="produtos_b2c.html" class="btn btn-secondary">🏠 Cápsulas B2C</a>
                <a href="acessorios.html" class="btn btn-secondary">🥄 Acessórios</a>
                <a href="pedidos.html" class="btn btn-secondary">📦 Pedidos</a>
            </div>
        </header>

        <!-- BARRA DE BUSCA E BOTÃO NOVO -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por SKU, Nome ou Categoria..." oninput="filtrarProdutos()">
            </div>
            <button class="btn btn-primary" onclick="abrirModalProduto()">+ Novo Produto B2B</button>
        </div>

        <!-- TABELA DE PRODUTOS B2B -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Nome da Cápsula</th>
                        <th>Categoria</th>
                        <th>Intensidade</th>
                        <th>Cápsulas / Caixa</th>
                        <th>Preço Unit. (R$)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutosBody">
                    <tr>
                        <td colspan="7" style="text-align: center;">Carregando produtos B2B...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE PRODUTO B2B -->
    <div id="modalProduto" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Novo Produto B2B</h2>
                <span class="close" onclick="fecharModalProduto()">&times;</span>
            </div>
            <form id="formProduto" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>SKU (Código):</label>
                        <input type="text" id="skuInput" required>
                    </div>
                    <div class="form-group">
                        <label>Nome da Cápsula:</label>
                        <input type="text" id="nomeInput" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Categoria:</label>
                        <input type="text" id="categoriaInput" placeholder="Ex: Origins, Creations, Intenso...">
                    </div>
                    <div class="form-group">
                        <label>Intensidade:</label>
                        <input type="number" id="intensidadeInput" min="1" max="13">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cápsulas por Caixa:</label>
                        <input type="number" id="capsulasCaixaInput" value="50" required>
                    </div>
                    <div class="form-group">
                        <label>Preço da Cápsula (R$):</label>
                        <input type="text" id="precoInput" placeholder="Ex: 3.10">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalProduto()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="produtos_b2b.js"></script>
</body>
</html>
