<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes - Pedidos</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-page">

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>Clientes</h1>
                <p>Cadastre, pesquise e visualize seus clientes sincronizados em tempo real</p>
            </div>
            
        </header>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar por Nome Fantasia, Razão Social, NN, CNPJ ou Contato..." onkeyup="filtrarClientes()">
            <button class="btn btn-primary" onclick="abrirModal()">+ Novo Cliente</button>
        </div>

        <!-- TABELA DE CLIENTES -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NN</th>
                        <th>Nome Fantasia</th>
                        <th>Razão Social</th>
                        <th>CNPJ</th>
                        <th>Endereço Completo</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody">
                    <tr><td colspan="6" style="text-align:center; color: #78717a; padding: 24px;">Carregando clientes da nuvem...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAR / DETALHES -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes do Cliente</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Conteúdo preenchido via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="clienteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Novo Cliente</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="clienteForm" onsubmit="salvarCliente(event)">
                <input type="hidden" id="clienteId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>NN (Número de Negócio):</label>
                        <input type="text" id="nnInput" required placeholder="Ex: 5730465">
                    </div>
                    <div class="form-group">
                        <label>CNPJ:</label>
                        <input type="text" id="cnpjInput" required placeholder="Ex: 01.795.809/0004-62">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Fantasia:</label>
                        <input type="text" id="nomeFantasiaInput" placeholder="Ex: Loja Exemplo">
                    </div>
                    <div class="form-group">
                        <label>Razão Social:</label>
                        <input type="text" id="razaoSocialInput" required placeholder="Ex: Comércio Ltda">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contato / Responsável:</label>
                        <input type="text" id="contatoInput" placeholder="Ex: João Silva">
                    </div>
                    <div class="form-group">
                        <label>Telefone / WhatsApp:</label>
                        <input type="text" id="telefoneInput" placeholder="Ex: (45) 99999-9999">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Endereço (Rua, Número):</label>
                        <input type="text" id="enderecoInput" placeholder="Ex: R Dr Alexandre Gutierre, 826">
                    </div>
                    <div class="form-group">
                        <label>Bairro:</label>
                        <input type="text" id="bairroInput" placeholder="Ex: Centro / Vila Yolanda">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cidade / UF:</label>
                        <input type="text" id="cidadeInput" placeholder="Ex: Foz do Iguaçu - PR">
                    </div>
                    <div class="form-group">
                        <label>CEP:</label>
                        <input type="text" id="cepInput" placeholder="Ex: 85851-000">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <!-- clientes.js -->
    <script src="clientes.js?v=2"></script>
    <script src="ui.js?v=2"></script>
</body>
</html>
