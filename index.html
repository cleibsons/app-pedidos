<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes - Sistema Nespresso</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- CABEÇALHO E NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>👥 Gestão de Clientes</h1>
                <p>Cadastre e consulte seus clientes Nespresso Professional</p>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-primary">👥 Clientes</a>
                <a href="produtos_b2b.html" class="btn btn-secondary">☕ Cápsulas B2B</a>
                <a href="produtos_b2c.html" class="btn btn-secondary">🏠 Cápsulas B2C</a>
                <a href="acessorios.html" class="btn btn-secondary">🥄 Acessórios</a>
                <a href="pedidos.html" class="btn btn-secondary">📦 Pedidos</a>
            </div>
        </header>

        <!-- BARRA DE BUSCA E BOTÃO NOVO -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por Razão Social, Nome Fantasia, NN ou CNPJ..." oninput="filtrarClientes()">
            </div>
            <button class="btn btn-primary" onclick="abrirModalCliente()">+ Novo Cliente</button>
        </div>

        <!-- TABELA DE CLIENTES -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NN</th>
                        <th>CNPJ</th>
                        <th>Nome Fantasia</th>
                        <th>Razão Social</th>
                        <th>Cidade / UF</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaClientesBody">
                    <tr>
                        <td colspan="6" style="text-align: center;">Carregando clientes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO DE CLIENTE -->
    <div id="modalCliente" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Novo Cliente</h2>
                <span class="close" onclick="fecharModalCliente()">&times;</span>
            </div>
            <form id="formCliente" onsubmit="salvarCliente(event)">
                <input type="hidden" id="clienteId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Número Nespresso (NN):</label>
                        <input type="text" id="nnInput" required>
                    </div>
                    <div class="form-group">
                        <label>CNPJ:</label>
                        <input type="text" id="cnpjInput" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Razão Social:</label>
                        <input type="text" id="razaoInput" required>
                    </div>
                    <div class="form-group">
                        <label>Nome Fantasia:</label>
                        <input type="text" id="fantasiaInput">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Endereço (Rua, Número, Compl.):</label>
                        <input type="text" id="enderecoInput">
                    </div>
                    <div class="form-group">
                        <label>Bairro:</label>
                        <input type="text" id="bairroInput">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cidade / UF:</label>
                        <input type="text" id="cidadeInput">
                    </div>
                    <div class="form-group">
                        <label>CEP:</label>
                        <input type="text" id="cepInput">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contato / Comprador:</label>
                        <input type="text" id="contatoInput">
                    </div>
                    <div class="form-group">
                        <label>Telefone / WhatsApp:</label>
                        <input type="text" id="telefoneInput">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalCliente()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
