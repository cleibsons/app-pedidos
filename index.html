<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes - Pedidos</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Biblioteca Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- CABEÇALHO E MENU DE NAVEGAÇÃO -->
        <header class="header">
            <div>
                <h1>👥 Gestão de Clientes</h1>
                <p>Cadastre, pesquise e visualize seus clientes sincronizados em tempo real</p>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="btn btn-primary">👥 Clientes</a>
                <a href="produtos_b2b.html" class="btn btn-secondary">☕ Cápsulas B2B</a>
            </div>
        </header>

        <!-- BARRA DE AÇÕES -->
        <div class="actions-bar">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar por Nome Fantasia, Razão Social, NN, CNPJ ou Contato..." onkeyup="filtrarClientes()">
            <button class="btn btn-primary" onclick="abrirModal()">+ Novo Cliente</button>
        </div>

        <!-- TABELA DE CLIENTES -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>NN</th>
                        <th>Nome Fantasia</th>
                        <th>Razão Social</th>
                        <th>CNPJ</th>
                        <th>Endereço Completo</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody">
                    <tr><td colspan="6" style="text-align:center; color: #64748b; padding: 24px;">Carregando clientes da nuvem...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO DE DETALHES -->
    <div id="detalhesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Detalhes do Cliente</h2>
                <button class="close-btn" onclick="fecharModalDetalhes()">&times;</button>
            </div>
            <div class="details-grid" id="detalhesConteudo">
                <!-- Dados preenchidos via JS -->
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-secondary" onclick="fecharModalDetalhes()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO / EDIÇÃO -->
    <div id="clienteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Cadastrar Cliente</h2>
                <button class="close-btn" onclick="fecharModal()">&times;</button>
            </div>
            <form id="clienteForm" onsubmit="salvarCliente(event)">
                <input type="hidden" id="clienteId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>NN (Número do Cliente):</label>
                        <input type="text" id="nnInput" required placeholder="Ex: 410191">
                    </div>
                    <div class="form-group">
                        <label>CNPJ:</label>
                        <input type="text" id="cnpjInput" required placeholder="Ex: 00.000.000/0000-00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Fantasia (Busca Fácil):</label>
                        <input type="text" id="fantasiaInput" placeholder="Ex: Belmond Hotel">
                    </div>
                    <div class="form-group">
                        <label>Razão Social (Oficial):</label>
                        <input type="text" id="razaoInput" required placeholder="Ex: Belmond Brasil Hotéis S.A">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Pessoa de Contato:</label>
                        <input type="text" id="contatoInput" placeholder="Ex: João Silva">
                    </div>
                    <div class="form-group">
                        <label>Telefone / WhatsApp:</label>
                        <input type="text" id="telefoneInput" placeholder="Ex: (45) 99999-9999">
                    </div>
                </div>

                <div class="form-group">
                    <label>Endereço (Rua e Número):</label>
                    <input type="text" id="enderecoInput" required placeholder="Ex: Rodovia BR-469, S/N, Km 32">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Bairro:</label>
                        <input type="text" id="bairroInput" placeholder="Ex: Centro">
                    </div>
                    <div class="form-group">
                        <label>Cidade / UF:</label>
                        <input type="text" id="cidadeInput" required value="Foz do Iguaçu - PR">
                    </div>
                    <div class="form-group">
                        <label>CEP:</label>
                        <input type="text" id="cepInput" required placeholder="Ex: 85850-000">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
        </div>
    </div>

    <script src="clientes.js"></script>
</body>
</html>
