<form id="clienteForm" onsubmit="salvarCliente(event)">
                <input type="hidden" id="clienteId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>NN (Número de Negócio):</label>
                        <input type="text" id="nnInput" required placeholder="Ex: 5730465">
                    </div>
                    <div class="form-group">
                        <label>CNPJ:</label>
                        <input type="text" id="cnpjInput" required placeholder="Ex: 01.795.809/0004-62">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Fantasia:</label>
                        <input type="text" id="nomeFantasiaInput" placeholder="Ex: Loja Exemplo">
                    </div>
                    <div class="form-group">
                        <label>Razão Social:</label>
                        <input type="text" id="razaoSocialInput" required placeholder="Ex: Comércio Ltda">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Contato / Responsável:</label>
                        <input type="text" id="contatoInput" placeholder="Ex: João Silva">
                    </div>
                    <div class="form-group">
                        <label>Telefone / WhatsApp:</label>
                        <input type="text" id="telefoneInput" placeholder="Ex: (45) 99999-9999">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Endereço (Rua, Número):</label>
                        <input type="text" id="enderecoInput" placeholder="Ex: R Dr Alexandre Gutierre, 826">
                    </div>
                    <div class="form-group">
                        <label>Bairro:</label>
                        <input type="text" id="bairroInput" placeholder="Ex: Centro / Vila Yolanda">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cidade / UF:</label>
                        <input type="text" id="cidadeInput" placeholder="Ex: Foz do Iguaçu - PR">
                    </div>
                    <div class="form-group">
                        <label>CEP:</label>
                        <input type="text" id="cepInput" placeholder="Ex: 85851-000">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar na Nuvem</button>
                </div>
            </form>
